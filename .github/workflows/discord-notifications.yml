name: Discord notifications

on:
  push:
    branches:
      - main
      - 'uyruw3-*'
  issues:
    types: [opened, closed]
  pull_request:
    types: [opened, closed, reopened, ready_for_review]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_URL: ${{ github.event.pull_request.html_url || github.event.issue.html_url || github.event.head_commit.url || github.server_url }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${DISCORD_WEBHOOK_URL}" ]]; then
            echo "DISCORD_WEBHOOK_URL no está configurado; se omite la notificación."
            exit 0
          fi

          message="@everyone
          ${REPOSITORY}: ${EVENT_NAME} ${EVENT_ACTION}
          Actor: ${ACTOR}
          Ref: ${REF_NAME}
          ${EVENT_URL}"

          payload="$(jq -n \
            --arg content "$message" \
            '{content: $content, allowed_mentions: {parse: ["everyone"]}}')"

          curl --fail --silent --show-error \
            --retry 2 \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"
