name: Notificaciones de Discord

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar actualización a Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          COMMIT_URL: ${{ github.event.head_commit.url || github.event.pull_request.html_url }}
        run: |
          set -euo pipefail

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::Falta configurar el secreto DISCORD_WEBHOOK_URL."
            exit 1
          fi

          jq -n \
            --arg title "Actualización en $REPOSITORY" \
            --arg description "$COMMIT_MESSAGE" \
            --arg url "$COMMIT_URL" \
            --arg actor "$ACTOR" \
            --arg event "$EVENT_NAME" \
            --arg ref "$REF_NAME" \
            '{
              username: "GitHub",
              embeds: [{
                title: $title,
                description: $description,
                url: $url,
                color: 5814783,
                fields: [
                  {name: "Autor", value: $actor, inline: true},
                  {name: "Evento", value: $event, inline: true},
                  {name: "Rama", value: $ref, inline: true}
                ]
              }]
            }' |
            curl --fail-with-body --silent --show-error \
              -H "Content-Type: application/json" \
              --data-binary @- \
              "$DISCORD_WEBHOOK_URL"
