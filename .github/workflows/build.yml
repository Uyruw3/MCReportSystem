name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing or new release tag to publish (for example v2.0.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn -B package

      - name: Prepare artifacts
        run: |
          JAR=$(ls target/MCReportPlugin-*.jar | grep -v original | head -n 1)
          cp "$JAR" MCReportPlugin.jar
          TAG="${{ inputs.release_tag || github.ref_name }}"
          echo "${TAG#v}" > latest.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          body: |
            MCReportPlugin ${{ inputs.release_tag || github.ref_name }}.

            Incluye el flujo seguro de actualización para hosts gestionados:
            el JAR pendiente se descarga sin sobrescribir el JAR cargado y se
            aplica manualmente desde el panel con el servidor detenido.
          files: |
            MCReportPlugin.jar
            latest.txt