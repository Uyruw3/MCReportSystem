  update-instructions: |-
    &eSafe update for managed hosts:
    &71. Stop the server from the panel (do not use /reload).
    &72. Open plugins/ in the file manager.
    &73. Rename MCReportPlugin.jar to MCReportPlugin.jar.bak.
    &74. Rename MCReportPlugin-new.jar to MCReportPlugin.jar.
    &75. Start the server and run /mcreport updatestatus.
    &cNever delete or replace the JAR while the server is running.
