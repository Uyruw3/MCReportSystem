    &eActualización segura para hosts gestionados:
    &71. Detén el servidor desde el panel (no uses /reload).
    &72. En el gestor de archivos, abre plugins/.
    &73. Renombra MCReportPlugin.jar a MCReportPlugin.jar.bak.
    &74. Renombra MCReportPlugin-new.jar a MCReportPlugin.jar.
    &75. Inicia el servidor y ejecuta /mcreport updatestatus.
