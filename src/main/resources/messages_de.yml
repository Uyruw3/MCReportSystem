    &71. Stoppe den Server über das Panel (verwende nicht /reload).
    &72. Öffne plugins/ im Dateimanager.
    &73. Benenne MCReportPlugin.jar in MCReportPlugin.jar.bak um.
    &74. Benenne MCReportPlugin-new.jar in MCReportPlugin.jar um.
    &75. Starte den Server und führe /mcreport updatestatus aus.
